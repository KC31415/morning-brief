# Instruments shown on the dashboard.
# source: yfinance (default), fred or ecb (ecb also needs `series`)
# kind: price (show % change) or yield (show change in basis points)
# session: key into `sessions` below, used to label what the change measures
# calendar: overrides the session's calendar when a series follows a different schedule
# reference: true for a second source only: fetched and checked, shown in its main row's cross-check cell

instruments:
  # Equities
  - {ticker: ES=F,     name: S&P 500 futures,      group: Equities,    kind: price, session: futures_fx}
  - {ticker: NQ=F,     name: Nasdaq 100 futures,   group: Equities,    kind: price, session: futures_fx}
  - {ticker: RTY=F,    name: Russell 2000 futures, group: Equities,    kind: price, session: futures_fx}
  - {ticker: ^STOXX50E, name: Euro Stoxx 50,       group: Equities,    kind: price, session: europe}
  - {ticker: ^N225,    name: Nikkei 225,           group: Equities,    kind: price, session: tokyo}
  - {ticker: ^HSI,     name: Hang Seng,            group: Equities,    kind: price, session: hong_kong}
  - {ticker: ^VIX,     name: VIX,                  group: Equities,    kind: price, session: us_vix}

  - {ticker: VIXCLS,   name: VIX (FRED),           group: Equities,    kind: price, source: fred, session: us_vix, reference: true}

  # Rates (yields in percent)
  - {ticker: ^IRX,     name: US 3M T-bill rate,    group: Rates,       kind: yield, session: us_bonds}
  - {ticker: ^FVX,     name: US 5Y yield,          group: Rates,       kind: yield, session: us_bonds}
  - {ticker: ^TNX,     name: US 10Y yield,         group: Rates,       kind: yield, session: us_bonds}
  - {ticker: DGS10,    name: US 10Y yield (FRED),  group: Rates,       kind: yield, source: fred, session: us_bonds, reference: true, calendar: USFED}
  - {ticker: DGS5,     name: US 5Y yield (FRED),   group: Rates,       kind: yield, source: fred, session: us_bonds, reference: true, calendar: USFED}
  # DTB3, not DGS3MO: ^IRX and DTB3 are both quoted on a discount basis
  - {ticker: DTB3,     name: US 3M T-bill rate (FRED), group: Rates,       kind: yield, source: fred, session: us_bonds, reference: true, calendar: USFED}

  # FX
  - {ticker: DX-Y.NYB, name: Dollar index,         group: FX,          kind: price, session: futures_fx}
  - {ticker: EURUSD=X, name: EUR/USD,              group: FX,          kind: price, session: fx}
  - {ticker: ECB_EURUSD, name: EUR/USD (ECB),      group: FX,          kind: price, source: ecb, series: D.USD.EUR.SP00.A, session: ecb, reference: true}
  - {ticker: USDJPY=X, name: USD/JPY,              group: FX,          kind: price, session: fx}
  - {ticker: GBPUSD=X, name: GBP/USD,              group: FX,          kind: price, session: fx}

  # H.10 noon rates, published weekly, so they can be six business days behind
  - {ticker: DEXJPUS,  name: USD/JPY (FRED),       group: FX,          kind: price, source: fred, session: fx, reference: true, lag_bdays: 6, calendar: USFED}
  - {ticker: DEXUSUK,  name: GBP/USD (FRED),       group: FX,          kind: price, source: fred, session: fx, reference: true, lag_bdays: 6, calendar: USFED}

  # Commodities
  - {ticker: CL=F,     name: WTI crude,            group: Commodities, kind: price, session: futures_fx}
  - {ticker: NG=F,     name: Natural gas,          group: Commodities, kind: price, session: futures_fx}
  - {ticker: GC=F,     name: Gold,                 group: Commodities, kind: price, session: futures_fx}
  - {ticker: HG=F,     name: Copper,               group: Commodities, kind: price, session: futures_fx}
  - {ticker: ZC=F,     name: Corn,                 group: Commodities, kind: price, session: cbot}
  - {ticker: ZW=F,     name: Wheat,                group: Commodities, kind: price, session: cbot}
  - {ticker: ZS=F,     name: Soybeans,             group: Commodities, kind: price, session: cbot}
  # EIA spot price, published weekly
  - {ticker: DCOILWTICO, name: WTI spot (FRED),    group: Commodities, kind: price, source: fred, session: futures_fx, reference: true, lag_bdays: 5}

# When each market's daily row is complete. A row fetched before this time on its
# own date is labeled "live"; afterwards it gets the `complete` label.
# calendar: the dates each market should have a row (see calendars.py). Yahoo's futures
# and Dollar index have no row on US holidays, so they follow XNYS, not CME.
sessions:
  futures_fx: {tz: America/New_York, close: "17:00", complete: last session, calendar: XNYS}
  fx:         {tz: America/New_York, close: "17:00", complete: last session, calendar: FX}
  cbot:       {tz: America/Chicago,  close: "13:20", complete: last session, calendar: XNYS}
  europe:     {tz: Europe/Berlin,    close: "17:30", complete: last session, calendar: XETR}
  ecb:        {tz: Europe/Berlin,    close: "16:00", complete: last session, calendar: TARGET}
  tokyo:      {tz: Asia/Tokyo,       close: "15:30", complete: last session, calendar: XTKS}
  hong_kong:  {tz: Asia/Hong_Kong,   close: "16:00", complete: last session, calendar: XHKG}
  us_vix:     {tz: America/New_York, close: "16:15", complete: prior US session, calendar: XNYS}
  us_bonds:   {tz: America/New_York, close: "15:30", complete: prior US session, calendar: XNYS}

# Pairs of series that measure the same thing, used to cross-check sources.
# tolerance is in the series' units (percentage points for yields: 0.05 = 5bp).
# The sources snapshot at different times, so warn sits just above the largest gap
# seen over about 120 sessions (in brackets), and fail at about 3x warn.
reconcile:
  - {a: ^TNX,     b: DGS10,      warn: 0.05, fail: 0.15}   # (0.048)
  - {a: ^FVX,     b: DGS5,       warn: 0.05, fail: 0.15}   # (0.041)
  - {a: ^IRX,     b: DTB3,       warn: 0.08, fail: 0.24}   # (0.060)
  - {a: EURUSD=X, b: ECB_EURUSD, warn: 0.01, fail: 0.03}   # (0.0077) ECB fixes near 14:15 CET
  # These four were measured over about 2 years instead (see build notes).
  - {a: ^VIX,     b: VIXCLS,     warn: 0.05, fail: 0.50}   # (0 apart from one 2.61 gap the check should catch)
  - {a: USDJPY=X, b: DEXJPUS,    warn: 4.0,  fail: 12.0}   # (3.83) in yen; FRED is noon New York
  - {a: GBPUSD=X, b: DEXUSUK,    warn: 0.02, fail: 0.06}   # (0.0182) FRED is noon New York
  - {a: CL=F,     b: DCOILWTICO, warn: 8.0,  fail: 24.0}   # (7.18) front-month future vs spot: a coarse check

# Official sources only: see docs/build-notes.md for why, before adding a publisher.
news_feeds:
  - {name: Federal Reserve, url: "https://www.federalreserve.gov/feeds/press_all.xml"}
  - {name: ECB,             url: "https://www.ecb.europa.eu/rss/press.html"}
  - {name: BEA,             url: "https://apps.bea.gov/rss/rss.xml"}
  - {name: EIA,             url: "https://www.eia.gov/rss/todayinenergy.xml"}

checks:
  lookback_days: 60          # history used for volatility in the sanity check
  stale_warn_bdays: 1        # sessions behind expected before WARN
  stale_fail_bdays: 3        # ... before FAIL
  gap_warn: 3                # missing sessions in lookback before WARN
  move_warn_z: 4.0           # daily move this many robust std devs (scaled MAD) -> WARN
  move_fail_z: 10.0          # ... this many -> FAIL (almost certainly bad data)
  min_rows: 22               # fewer rows than this -> WARN (sanity needs 21 changes to judge)
  frozen_changes: 10         # this many unchanged closes in a row -> FAIL (frozen feed)
