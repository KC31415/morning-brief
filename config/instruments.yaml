# Instruments shown on the dashboard.
# source: yfinance (default), fred or ecb (ecb also needs `series`)
# kind: price (show % change) or yield (show change in basis points)
# session: key into `sessions` below, used to label what the change measures

instruments:
  # Equities
  - {ticker: ES=F,     name: S&P 500 futures,      group: Equities,    kind: price, session: futures_fx}
  - {ticker: NQ=F,     name: Nasdaq 100 futures,   group: Equities,    kind: price, session: futures_fx}
  - {ticker: RTY=F,    name: Russell 2000 futures, group: Equities,    kind: price, session: futures_fx}
  - {ticker: ^STOXX50E, name: Euro Stoxx 50,       group: Equities,    kind: price, session: europe}
  - {ticker: ^N225,    name: Nikkei 225,           group: Equities,    kind: price, session: tokyo}
  - {ticker: ^HSI,     name: Hang Seng,            group: Equities,    kind: price, session: hong_kong}
  - {ticker: ^VIX,     name: VIX,                  group: Equities,    kind: price, session: us_vix}

  # Rates (yields in percent)
  - {ticker: ^IRX,     name: US 3M T-bill rate,    group: Rates,       kind: yield, session: us_bonds}
  - {ticker: ^FVX,     name: US 5Y yield,          group: Rates,       kind: yield, session: us_bonds}
  - {ticker: ^TNX,     name: US 10Y yield,         group: Rates,       kind: yield, session: us_bonds}
  - {ticker: DGS10,    name: US 10Y yield (FRED),  group: Rates,       kind: yield, source: fred, session: us_bonds}
  - {ticker: DGS5,     name: US 5Y yield (FRED),   group: Rates,       kind: yield, source: fred, session: us_bonds}
  # DTB3, not DGS3MO: ^IRX and DTB3 are both quoted on a discount basis
  - {ticker: DTB3,     name: US 3M bill (FRED),    group: Rates,       kind: yield, source: fred, session: us_bonds}

  # FX
  - {ticker: DX-Y.NYB, name: Dollar index,         group: FX,          kind: price, session: futures_fx}
  - {ticker: EURUSD=X, name: EUR/USD,              group: FX,          kind: price, session: futures_fx}
  - {ticker: ECB_EURUSD, name: EUR/USD (ECB),      group: FX,          kind: price, source: ecb, series: D.USD.EUR.SP00.A, session: ecb}
  - {ticker: USDJPY=X, name: USD/JPY,              group: FX,          kind: price, session: futures_fx}
  - {ticker: GBPUSD=X, name: GBP/USD,              group: FX,          kind: price, session: futures_fx}

  # Commodities
  - {ticker: CL=F,     name: WTI crude,            group: Commodities, kind: price, session: futures_fx}
  - {ticker: NG=F,     name: Natural gas,          group: Commodities, kind: price, session: futures_fx}
  - {ticker: GC=F,     name: Gold,                 group: Commodities, kind: price, session: futures_fx}
  - {ticker: HG=F,     name: Copper,               group: Commodities, kind: price, session: futures_fx}
  - {ticker: ZC=F,     name: Corn,                 group: Commodities, kind: price, session: cbot}
  - {ticker: ZW=F,     name: Wheat,                group: Commodities, kind: price, session: cbot}
  - {ticker: ZS=F,     name: Soybeans,             group: Commodities, kind: price, session: cbot}

# When each market's daily row is complete. A row fetched before this time on its
# own date is labeled "live"; afterwards it gets the `complete` label.
sessions:
  futures_fx: {tz: America/New_York, close: "17:00", complete: last session}
  cbot:       {tz: America/Chicago,  close: "13:20", complete: last session}
  europe:     {tz: Europe/Berlin,    close: "17:30", complete: last session}
  ecb:        {tz: Europe/Berlin,    close: "16:00", complete: last session}
  tokyo:      {tz: Asia/Tokyo,       close: "15:30", complete: last session}
  hong_kong:  {tz: Asia/Hong_Kong,   close: "16:00", complete: last session}
  us_vix:     {tz: America/New_York, close: "16:15", complete: prior US session}
  us_bonds:   {tz: America/New_York, close: "15:30", complete: prior US session}

# Pairs of series that measure the same thing, used to cross-check sources.
# tolerance is in the series' units (percentage points for yields: 0.05 = 5bp).
# The sources snapshot at different times, so warn sits just above the largest gap
# seen over about 120 sessions (in brackets), and fail at about 3x warn.
reconcile:
  - {a: ^TNX,     b: DGS10,      warn: 0.05, fail: 0.15}   # (0.048)
  - {a: ^FVX,     b: DGS5,       warn: 0.05, fail: 0.15}   # (0.041)
  - {a: ^IRX,     b: DTB3,       warn: 0.08, fail: 0.24}   # (0.060)
  - {a: EURUSD=X, b: ECB_EURUSD, warn: 0.01, fail: 0.03}   # (0.0077) ECB fixes near 14:15 CET

news_feeds:
  - {name: Federal Reserve, url: "https://www.federalreserve.gov/feeds/press_all.xml"}
  - {name: CNBC Markets,    url: "https://www.cnbc.com/id/20910258/device/rss/rss.html"}
  - {name: MarketWatch,     url: "https://feeds.content.dowjones.io/public/rss/mw_topstories"}

checks:
  lookback_days: 60          # history used for volatility in the sanity check
  stale_warn_bdays: 1        # business days behind expected before WARN
  stale_fail_bdays: 3        # ... before FAIL
  gap_warn: 3                # missing business days in lookback before WARN
  move_warn_z: 4.0           # daily move this many robust std devs (scaled MAD) -> WARN
  move_fail_z: 10.0          # ... this many -> FAIL (almost certainly bad data)
  min_rows: 22               # fewer rows than this -> WARN (sanity needs 21 changes to judge)
  frozen_changes: 10         # this many unchanged closes in a row -> FAIL (frozen feed)
